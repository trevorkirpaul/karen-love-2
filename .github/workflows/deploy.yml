name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Astro & TypeScript checks
        run: npx astro check

      - name: Run unit tests
        run: npm test

      - name: Build static site and contact server
        run: |
          npm run build
          npm run build:server

      - name: Deploy dist/ and contact server to VPS via rsync over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          rsync -avz --delete -e "ssh -i ~/.ssh/id_deploy" dist/ "${VPS_USER}@${VPS_HOST}:/var/www/podiatry-site/"
          ssh -i ~/.ssh/id_deploy "${VPS_USER}@${VPS_HOST}" "mkdir -p /opt/podiatry-contact"
          rsync -avz -e "ssh -i ~/.ssh/id_deploy" dist-server/contact.mjs "${VPS_USER}@${VPS_HOST}:/opt/podiatry-contact/contact.mjs"
          ssh -i ~/.ssh/id_deploy "${VPS_USER}@${VPS_HOST}" "if systemctl is-active --quiet karen-contact; then sudo systemctl restart karen-contact; fi"
