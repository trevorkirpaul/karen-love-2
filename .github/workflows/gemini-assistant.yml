name: Gemini Assistant

on:
  workflow_call:
    inputs:
      additional_context:
        type: string
        required: false
        default: ''

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  assistant:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Git user
        run: |
          git config user.name "gemini-cli[bot]"
          git config user.email "gemini-cli[bot]@users.noreply.github.com"

      - name: Run Gemini CLI
        id: gemini_run
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          ISSUE_TITLE: ${{ github.event.issue.title || github.event.pull_request.title }}
          ISSUE_BODY: ${{ github.event.issue.body || github.event.pull_request.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.5-flash-lite
          workflow_name: gemini-assistant
          upload_artifacts: true
          settings: |
            {
              "model": {
                "maxSessionTurns": 60
              }
            }
          prompt: |
            You are an autonomous coding assistant working on repository ${{ github.repository }}.
            Issue/PR #${{ env.ISSUE_NUMBER }}: "${{ env.ISSUE_TITLE }}"
            Description: ${{ env.ISSUE_BODY }}
            Latest Request: ${{ env.COMMENT_BODY }}

            Instructions:
            1. Inspect the codebase and implement the requested changes cleanly, following GEMINI.md.
            2. Run `npm run build` (and `npm run check` if available) to verify there are zero errors.
            3. Leave the modified files in the working directory—do NOT run git commit, git push, or gh pr create (the workflow handles git and PR creation automatically).
            4. End your response with a concise summary of what you changed and why.

      - name: Commit, Push, and Open Pull Request
        if: steps.gemini_run.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          ISSUE_TITLE: ${{ github.event.issue.title || github.event.pull_request.title }}
          GEMINI_RESPONSE: ${{ steps.gemini_run.outputs.gemini_response }}
        run: |
          rm -rf gemini-artifacts .gemini/telemetry.log

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No file changes detected; skipping PR creation."
            exit 0
          fi

          BRANCH_NAME="gemini/issue-${ISSUE_NUMBER}-$(date +%s)"
          git checkout -b "$BRANCH_NAME"
          git add -A
          git commit -m "fix: resolve #${ISSUE_NUMBER} - ${ISSUE_TITLE}"
          git push -u origin "$BRANCH_NAME"

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "Fix #${ISSUE_NUMBER}: ${ISSUE_TITLE}" \
            --body "Closes #${ISSUE_NUMBER}

          ### Summary of Changes
          ${GEMINI_RESPONSE}")

          gh issue comment "$ISSUE_NUMBER" --body "I've implemented the fix and opened a Pull Request: ${PR_URL}"
