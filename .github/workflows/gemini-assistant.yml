name: Gemini Assistant

on:
  workflow_call:
    inputs:
      additional_context:
        type: string
        required: false
        default: ''

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  assistant:
    runs-on: ubuntu-latest
    steps:
      - name: Determine Target Branch
        id: branch_info
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          IS_PR: ${{ github.event.issue.pull_request != null || github.event_name == 'pull_request' }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          if [[ "$IS_PR" == "true" ]]; then
            HEAD_REF=$(gh pr view "$PR_NUMBER" --json headRefName -q .headRefName)
            echo "is_pr=true" >> "$GITHUB_OUTPUT"
            echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          else
            echo "is_pr=false" >> "$GITHUB_OUTPUT"
            echo "head_ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch_info.outputs.head_ref }}
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure Chromium is available for visual checks
        run: |
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            npx playwright install chromium
          fi

      - name: Configure Git user
        run: |
          git config user.name "gemini-cli[bot]"
          git config user.email "gemini-cli[bot]@users.noreply.github.com"

      - name: Run Gemini CLI
        id: gemini_run
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          ISSUE_TITLE: ${{ github.event.issue.title || github.event.pull_request.title }}
          ISSUE_BODY: ${{ github.event.issue.body || github.event.pull_request.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.5-flash-lite
          workflow_name: gemini-assistant
          upload_artifacts: true
          settings: |
            {
              "model": {
                "maxSessionTurns": 60
              }
            }
          prompt: |
            You are an autonomous coding assistant working on repository ${{ github.repository }}.
            Issue/PR #${{ env.ISSUE_NUMBER }}: "${{ env.ISSUE_TITLE }}"
            Description: ${{ env.ISSUE_BODY }}
            Latest Request: ${{ env.COMMENT_BODY }}

            Instructions:
            1. Inspect the codebase and implement the requested changes cleanly, following GEMINI.md.
            2. Run `npm run build && npm run test:visual` (and `npm run check` if available) to verify there are zero build errors, horizontal overflow, or visual defects on mobile, tablet, and desktop. If `test:visual` reports overflow, fix the layout and re-run until it passes.
            3. Leave the modified files in the working directory—do NOT run git commit, git push, or gh pr create.
            4. End your response with a concise, plain-English summary of what you changed for a non-technical reviewer.

      - name: Commit, Push, and Open or Update PR
        if: steps.gemini_run.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          IS_PR: ${{ steps.branch_info.outputs.is_pr }}
          HEAD_REF: ${{ steps.branch_info.outputs.head_ref }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          ISSUE_TITLE: ${{ github.event.issue.title || github.event.pull_request.title }}
          ISSUE_BODY: ${{ github.event.issue.body || github.event.pull_request.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          GEMINI_RESPONSE: ${{ steps.gemini_run.outputs.gemini_response }}
        run: |
          rm -rf gemini-artifacts .gemini/telemetry.log

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No file changes detected."
            exit 0
          fi

          # Strip the "@gemini-cli " prefix so the email reads cleanly
          CLEAN_REQUEST=$(printf "%s" "${COMMENT_BODY:-$ISSUE_BODY}" | sed 's/^@gemini-cli[[:space:]]*//')

          if [[ "$IS_PR" == "true" ]]; then
            git add -A
            git commit -m "chore: iterate on PR #${ISSUE_NUMBER}"
            git push origin "$HEAD_REF"

            # Update PR body with the latest iteration request & summary so the preview email shows the full text
            gh pr edit "$ISSUE_NUMBER" --body "### Latest Change Request
          ${CLEAN_REQUEST}

          ### Summary of Changes
          ${GEMINI_RESPONSE}"
          else
            BRANCH_NAME="gemini/issue-${ISSUE_NUMBER}-$(date +%s)"
            git checkout -b "$BRANCH_NAME"
            git add -A
            git commit -m "fix: resolve #${ISSUE_NUMBER} - ${ISSUE_TITLE}"
            git push -u origin "$BRANCH_NAME"

            gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "${ISSUE_TITLE}" \
              --body "Closes #${ISSUE_NUMBER}

          ### Requested Change
          ${CLEAN_REQUEST}

          ### Summary of Changes
          ${GEMINI_RESPONSE}"
          fi
